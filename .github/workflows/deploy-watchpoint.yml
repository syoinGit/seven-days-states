name: Deploy WATCHPOINT Artifact

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::751091659794:role/rubinco-github-actions-role
          aws-region: ap-northeast-1

      - name: Upload artifact to S3
        run: |
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*original*' | head -1)

          echo "Uploading: $JAR"

          aws s3 cp "$JAR" \
            s3://rubinco-deploy-artifacts/watchpoint/app.jar