<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KILLS | WATCHPOINT</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>COMBAT ARCHIVE</small></span></a><a class="nav-button" th:href="@{/}">観測ログへ戻る</a></header>
<main class="layout detail-page">
  <header class="page-title"><p class="eyebrow">COMBAT / ELIMINATION LOG</p><h1>討伐記録</h1><p>荒野で積み上げた戦果を、プレイヤー別・時系列で確認します。</p></header>
  <section class="leader-grid"><article class="leader-card" th:each="row, stat : ${kills.leaders}"><span th:text="${#numbers.formatInteger(stat.index + 1, 2)}">01</span><div><small>OPERATOR</small><strong th:text="${row.playerName}">player</strong></div><b th:text="${#numbers.formatInteger(row.kills, 1, 'COMMA')}">0</b></article><p th:if="${#lists.isEmpty(kills.leaders)}" class="empty panel">まだ討伐ログがありません。</p></section>
  <article class="panel"><div class="panel-head"><h2>直近の討伐</h2><small>最新100件</small></div><ol class="combat-log"><li th:each="row : ${kills.recentKills}"><time th:text="${row.occurredAt}">time</time><div><strong th:text="${row.playerName}">player</strong><span>が</span><b th:text="${row.targetName}">target</b><span>を排除</span><small th:if="${!#strings.isEmpty(row.coordinate)}" th:text="${'LOC ' + row.coordinate}">loc</small></div></li><li th:if="${#lists.isEmpty(kills.recentKills)}" class="empty">まだ記録がありません。</li></ol></article>
</main></body></html>
