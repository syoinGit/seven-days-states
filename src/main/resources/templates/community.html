<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="60">
  <title>交流ログ | WATCHPOINT</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
  <a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>SURVIVOR COMMUNITY</small></span></a>
  <div class="auth-nav">
    <span th:if="${loggedIn}" th:text="${currentAccountLogin}">survivor</span>
    <a th:if="${!loggedIn}" class="nav-button" th:href="@{/login}">ログイン</a>
    <form th:if="${loggedIn}" method="post" th:action="@{/logout}"><button class="nav-button" type="submit">ログアウト</button></form>
  </div>
</header>
<main class="detail-shell">
  <nav th:replace="~{fragments/navigation :: rail('community')}"></nav>
  <section class="layout detail-page community-page">
    <header class="page-title">
      <nav class="breadcrumbs"><a th:href="@{/}"><span aria-hidden="true">⌂</span> 冒険記録</a><span>›</span><b>交流ログ</b></nav>
      <p class="eyebrow">SURVIVOR COMMUNITY</p>
      <h1>荒野のつぶやき</h1>
      <p>ゲームの記録に、冒険者たちの声を重ねる。</p>
    </header>

    <div class="form-notice success" th:if="${notice}" th:text="${notice}"></div>
    <div class="form-notice error" th:if="${error}" th:text="${error}"></div>

    <article class="panel community-compose" th:if="${loggedIn and currentPlayerId != null}">
      <div class="panel-head"><h2>いま何してる？</h2><small th:text="${currentAccountLogin}">SURVIVOR</small></div>
      <form class="ai-comment-form" method="post" th:action="@{/posts}">
        <label><span>投稿本文</span><textarea name="body" rows="3" maxlength="1000" placeholder="今日の冒険を記録する…" required></textarea></label>
        <div class="form-actions"><small>1000文字以内</small><button type="submit">投稿する</button></div>
      </form>
    </article>
    <article class="panel community-login-prompt" th:if="${!loggedIn}">
      <p>投稿やいいねを使うにはログインしてください。</p><a class="primary-link" th:href="@{/login}">ログインする</a>
    </article>
    <article class="panel community-login-prompt" th:if="${loggedIn and currentPlayerId == null and !currentViewer}">
      <p>このアカウントはゲームプレイヤーに未連携です。管理者に連携を依頼してください。</p>
    </article>

    <ol class="social-feed">
      <li class="social-post" th:each="post : ${posts}">
        <div class="feed-avatar" th:text="${#strings.substring(post.playerName, 0, 1)}">W</div>
        <div class="social-post-body">
          <header><a th:href="@{/players/{id}(id=${post.playerId})}" th:text="${post.playerName}">player</a><time th:text="${post.createdAt}">time</time></header>
          <p th:text="${post.body}">post</p>
          <footer>
            <form method="post" th:action="@{/posts/{id}/like(id=${post.id})}" th:if="${loggedIn}">
              <button class="like-button" th:classappend="${post.likedByCurrentAccount} ? ' liked'" type="submit"><span aria-hidden="true">♥</span> <span th:text="${post.likeCount}">0</span></button>
            </form>
            <span th:if="${!loggedIn}" class="like-count"><span aria-hidden="true">♥</span> <span th:text="${post.likeCount}">0</span></span>
          </footer>
        </div>
      </li>
      <li th:if="${#lists.isEmpty(posts)}" class="empty">まだ投稿がありません。</li>
    </ol>
  </section>
</main>
</body>
</html>
