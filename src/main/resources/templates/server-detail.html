<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="60"><title>SERVER | WATCHPOINT</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>SERVER VITALS</small></span></a><a class="nav-button" th:href="@{/}">冒険タイムラインへ戻る</a></header>
<main class="layout detail-page">
  <header class="page-title"><nav class="breadcrumbs"><a th:href="@{/}"><span aria-hidden="true">⌂</span> 冒険記録</a><span>›</span><b><span aria-hidden="true">⌁</span> サーバー情報</b></nav><p class="eyebrow">SYSTEM / TELEMETRY</p><h1>サーバーステータス</h1><p>ゲームサーバーから受信した稼働情報。人数は最新のTelnet観測を正とします。</p></header>
  <section class="metric-grid">
    <article class="metric-card"><span>ONLINE PILOTS</span><strong th:text="${server.current.playerCount ?: 0}">0</strong><small>最新のプレイヤー状態</small></article>
    <article class="metric-card"><span>FRAME RATE</span><strong th:text="${server.current.fps ?: '-'}">-</strong><small>FPS</small></article>
    <article class="metric-card"><span>HOSTILES</span><strong th:text="${server.current.zombieCount ?: '-'}">-</strong><small>ログ出力時の参考値</small></article>
    <article class="metric-card"><span>MEMORY RSS</span><strong th:text="${server.current.rssMb ?: '-'}">-</strong><small>MB</small></article>
  </section>
  <section class="detail-grid">
    <article class="panel"><div class="panel-head"><h2>直近のテレメトリ</h2><small>1分間隔 / 最大120件</small></div><div class="table-scroll"><table><thead><tr><th>取得時刻</th><th class="num">FPS</th><th class="num">ゾンビ</th><th class="num">エンティティ</th><th class="num">RSS MB</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(server.history)}"><td colspan="5" class="empty">まだ取得されていません。</td></tr><tr th:each="row : ${server.history}"><td th:text="${row.occurredAt}">-</td><td class="num" th:text="${row.fps ?: '-'}">-</td><td class="num" th:text="${row.zombieCount ?: '-'}">-</td><td class="num" th:text="${row.entityCount ?: '-'}">-</td><td class="num" th:text="${row.rssMb ?: '-'}">-</td></tr></tbody></table></div></article>
    <aside class="panel"><div class="panel-head"><h2>接続状態</h2></div><div class="pilot-list"><a class="pilot" th:each="player : ${server.players}" th:href="@{/players/{id}(id=${player.playerId})}"><span class="status-dot" th:classappend="${player.online == false} ? ' offline'"></span><span class="pilot-info"><strong th:text="${player.playerName}">player</strong><small th:text="${player.online == false ? 'OFFLINE' : player.poiName}">status</small></span><b th:text="${player.ping != null ? player.ping + 'ms' : '--'}">--</b></a></div></aside>
  </section>
</main></body></html>
