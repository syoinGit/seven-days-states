<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VEHICLES | WATCHPOINT</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>VEHICLE REGISTRY</small></span></a><a class="nav-button" th:href="@{/}">冒険タイムラインへ戻る</a></header>
<main class="layout detail-page">
  <header class="page-title"><nav class="breadcrumbs"><a th:href="@{/}">冒険記録</a><span>/</span><b>乗り物ランキング</b></nav><p class="eyebrow">RANKING / MOBILITY RECORD</p><h1>乗り物ランキング</h1><p>荒野を走り抜けた距離を、所有者と車両IDごとに記録します。</p></header>
  <section class="vehicle-grid"><article class="vehicle-card" th:each="vehicle, stat : ${vehicles.vehicles}" th:classappend="${vehicle.active == false} ? ' inactive'"><header><span><b class="vehicle-rank" th:text="${'#' + (stat.index + 1)}">#1</b> <span th:text="${vehicle.active == false ? 'LOST' : 'TRACKING'}">TRACKING</span></span><b th:text="${'ID ' + vehicle.vehicleEntityId}">ID 0</b></header><h2 th:text="${vehicle.vehicleName}">vehicle</h2><dl><div><dt>OWNER</dt><dd th:text="${vehicle.ownerName}">unknown</dd></div><div><dt>LOCATION</dt><dd th:text="${vehicle.coordinate ?: '-'}">-</dd></div><div><dt>DISTANCE</dt><dd><span th:text="${#numbers.formatDecimal(vehicle.totalDistance ?: 0, 1, 1)}">0.0</span> m</dd></div><div><dt>LAST SIGNAL</dt><dd th:text="${vehicle.lastUpdated ?: '-'}">-</dd></div></dl><small th:if="${vehicle.ownerInferenceMethod == 'nearest_fresh_player_position'}">OWNER LINK / POSITION INFERENCE</small></article><p th:if="${#lists.isEmpty(vehicles.vehicles)}" class="empty panel">まだ乗り物ログがありません。</p></section>
</main></body></html>
