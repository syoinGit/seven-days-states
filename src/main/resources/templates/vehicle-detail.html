<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VEHICLES | WATCHPOINT</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">WP</span><span><b>WATCHPOINT</b><small>VEHICLE REGISTRY</small></span></a><a class="nav-button" th:href="@{/}">冒険タイムラインへ戻る</a></header>
<main class="layout detail-page">
  <header class="page-title"><nav class="breadcrumbs"><a th:href="@{/}"><span aria-hidden="true">⌂</span> 冒険記録</a><span>›</span><b><span aria-hidden="true">◆</span> 乗り物ランキング</b></nav><p class="eyebrow">RANKING / MOBILITY RECORD</p><h1>乗り物ランキング</h1><p>所有者ごと・車種ごとに走行距離を統合しました。所有者を特定できない放置車両はランキングに含めません。</p></header>
  <section class="vehicle-grid"><article class="vehicle-card" th:each="vehicle, stat : ${vehicles.vehicles}" th:classappend="${vehicle.active == false} ? ' inactive'"><header><span><b class="vehicle-rank" th:text="${'#' + (stat.index + 1)}">#1</b> <span th:text="${vehicle.active == false ? 'ARCHIVED' : 'TRACKING'}">TRACKING</span></span><b th:text="${vehicle.vehicleCount + ' VEHICLES'}">1 VEHICLE</b></header><h2><span th:text="${vehicle.ownerName}">player</span><small> が </small><span th:text="${vehicle.vehicleName}">vehicle</span><small> で移動</small></h2><dl><div><dt>OWNER</dt><dd th:text="${vehicle.ownerName}">player</dd></div><div><dt>VEHICLE TYPE</dt><dd th:text="${vehicle.vehicleName}">vehicle</dd></div><div><dt>TOTAL DISTANCE</dt><dd><span th:text="${#numbers.formatDecimal(vehicle.totalDistance ?: 0, 1, 1)}">0.0</span> m</dd></div><div><dt>LAST SIGNAL</dt><dd th:text="${vehicle.lastUpdated ?: '-'}">-</dd></div></dl></article><p th:if="${#lists.isEmpty(vehicles.vehicles)}" class="empty panel">所有者と紐づいた乗り物記録はまだありません。</p></section>
</main></body></html>
